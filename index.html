<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>外国人名 漢字当て字ジェネレーター</title>
    <link rel="stylesheet" href="style.css">

    <!-- Gemini SDKの読み込み（必須） -->
    <script type="importmap">
    {
      "imports": {
        "@google/genai": "https://esm.run/@google/genai"
      }
    }
    </script>
</head>

<body>

<div class="container">

    <h1>外国人名 漢字当て字ジェネレーター</h1>

    <!-- 入力エリア -->
    <div class="search-box">
      <input type="text" id="nameInput" placeholder="例: Michael, Sofia" />
    </div>

    <!-- 条件設定エリア -->
    <div class="card">
        <label for="gender">性別</label>
        <select id="gender">
            <option value="male">男性</option>
            <option value="female">女性</option>
            <option value="neutral" selected>指定なし / 中性</option>
        </select>
    </div>

    <div class="card">
        <label for="count">候補数</label>
        <select id="count">
            <option value="3" selected>3つ</option>
            <option value="5">5つ</option>
            <option value="10">10個</option>
        </select>
    </div>

    <!-- 生成実行ボタン -->
    <button id="generateBtn">漢字を生成する</button>

    <!-- エラー・ローディング・結果表示エリア -->
    <div id="errorMsg" class="error-msg" style="display: none;"></div>
    <div id="loading" class="loading" style="display: none;">AIが漢字を考えています...</div>
    <div id="resultArea" class="results">
        ここに変換結果が表示されます。
    </div>

</div>

<!-- AI読み込み用のメインスクリプト（旧ファイルの読み込みは削除し、これ1つに統一します） -->
<script type="module" src="js/script.js"></script>

</body>

</html>
